name: Build iOS (IPA)

on:
  push:
    branches: [main, master, gemini]
    tags: ["v*"]
  pull_request:
    branches: [main, master, gemini]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-unsigned:
    name: IPA (UNSIGNED - not installable on stock devices)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Build native iOS app without signing
        run: |
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          xcodebuild \
            -project mobile/ios/Runner.xcodeproj \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath mobile/build/ios/DerivedData \
            "MARKETING_VERSION=0.0.2+$COMMIT_HASH" \
            "IMMICHZ_GIT_COMMIT=$COMMIT_HASH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .app into an .ipa
        run: |
          APP="mobile/build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP" || { echo "::error::$APP not found"; exit 1; }
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          PLIST="$APP/Info.plist"
          VERSION="0.0.2+$COMMIT_HASH"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $VERSION" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleShortVersionString string $VERSION" \
            "$PLIST"
          mkdir -p mobile/build/ios/package/Payload
          cp -R "$APP" mobile/build/ios/package/Payload/
          (cd mobile/build/ios/package && \
            /usr/bin/zip --symlinks -qry ../../../ImmichZ-unsigned.ipa Payload)
          ls -lh mobile/ImmichZ-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: immich-z-ios-ipa-unsigned
          path: mobile/ImmichZ-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish unsigned IPA to latest-build release (quota fallback)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/gemini'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-build"
          gh release view "$TAG" >/dev/null 2>&1 || {
            gh release create "$TAG" --title "Latest Build (Continuous)" \
              --notes "Continuously updated build artifacts."
          }
          gh release upload "$TAG" mobile/ImmichZ-unsigned.ipa --clobber

      - name: Upload raw .app bundle
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: immich-z-ios-app-bundle
          path: mobile/build/ios/DerivedData/Build/Products/*/Runner.app
          if-no-files-found: warn
          retention-days: 30

  build-ios-signed:
    name: IPA (signed)
    runs-on: macos-15
    if: ${{ vars.ENABLE_IOS_SIGNING == 'true' }}
    steps:
      - uses: actions/checkout@v6

      - name: Import signing certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE_BASE64" | \
            base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KC" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychain -d user -s "$KC"
          security find-identity -v -p codesigning

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: >-
            ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP="$RUNNER_TEMP/build_pp.mobileprovision"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i "$PP" | \
            grep -aA1 UUID | grep -o "[-a-zA-Z0-9]\{36\}" | head -1)
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP" "$profile_dir/$UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Build signed native iOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_TEAM_ID" || {
            echo "::error::Configure APPLE_TEAM_ID for signed builds"
            exit 1
          }
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          xcodebuild \
            -project mobile/ios/Runner.xcodeproj \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath mobile/build/ios/SignedDerivedData \
            "MARKETING_VERSION=0.0.2+$COMMIT_HASH" \
            "IMMICHZ_GIT_COMMIT=$COMMIT_HASH" \
            "PROVISIONING_PROFILE_SPECIFIER=$PROVISIONING_PROFILE_UUID" \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            build

      - name: Package signed IPA
        run: |
          APP="mobile/build/ios/SignedDerivedData/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP"
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          PLIST="$APP/Info.plist"
          VERSION="0.0.2+$COMMIT_HASH"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $VERSION" \
            "$PLIST" 2>/dev/null || true
          mkdir -p mobile/build/ios/signed-package/Payload
          cp -R "$APP" mobile/build/ios/signed-package/Payload/
          (cd mobile/build/ios/signed-package && \
            /usr/bin/zip --symlinks -qry ../../../ImmichZ-signed.ipa Payload)

      - uses: actions/upload-artifact@v6
        with:
          name: immich-z-ios-ipa-signed
          path: mobile/ImmichZ-signed.ipa
          if-no-files-found: error
