name: Build iOS (IPA)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # UNSIGNED: runs on every push with zero secrets.
  #
  # `flutter build ipa --no-codesign` deliberately SKIPS IPA generation
  # (verified in packages/flutter_tools/lib/src/commands/build_ios.dart), so the
  # Payload/ + zip step below is the only way to get an .ipa without a signing
  # identity.
  #
  # This artifact CANNOT be installed on a normal (non-jailbroken) iPhone: iOS
  # enforces code signing at install time, and ad-hoc/development distribution
  # both require a paid Apple Developer Program membership. It is still useful
  # as (a) a per-commit compile check of the iOS target and (b) a source bundle
  # for jailbroken devices or for local re-signing (Sideloadly / AltStore with a
  # free Apple ID, 7-day expiry).
  # ---------------------------------------------------------------------------
  build-ios-unsigned:
    name: IPA (UNSIGNED - not installable on stock devices)
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.1"
          cache: true
          cache-key: flutter-ios-3.35.1

      - run: flutter --version
      - run: flutter config --no-analytics
      - run: flutter pub get

      # flutter build ios always validates the Development Team for device
      # builds (even with --no-codesign), so generate the Xcode project with
      # Flutter and then compile it directly with signing disabled — the same
      # approach as a manual `xcodebuild CODE_SIGNING_ALLOWED=NO` build.
      - name: Generate iOS project (no build)
        run: flutter build ios --config-only --no-codesign

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Build unsigned .app with xcodebuild
        run: |
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            "IMMICHZ_GIT_COMMIT=$COMMIT_HASH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .app into an .ipa
        run: |
          APP="build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP" || { echo "::error::$APP not found"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip --symlinks -qry ImmichZ-unsigned.ipa Payload
          ls -lh ImmichZ-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: immich-z-ios-ipa-unsigned
          path: mobile/ImmichZ-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish unsigned IPA to latest-build release (quota fallback)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-build"
          TITLE="Latest Build (Continuous)"
          gh release view "$TAG" >/dev/null 2>&1 || {
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "Continuously updated build artifacts."
          }
          gh release upload "$TAG" ImmichZ-unsigned.ipa --clobber

      - name: Upload raw .app bundle
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: immich-z-ios-app-bundle
          path: mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # SIGNED: enabled by setting the ENABLE_IOS_SIGNING repository variable to
  # 'true' after configuring the Apple secrets. Requires a PAID membership.
  # Note: Flutter remaps the export `method` for Xcode >= 15.4 when you use
  # --export-method, so the legacy values above stay correct here.
  # ---------------------------------------------------------------------------
  build-ios-signed:
    name: IPA (signed)
    runs-on: macos-15
    if: ${{ vars.ENABLE_IOS_SIGNING == 'true' }}
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.1"
          cache: true

      - name: Import signing certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE_BASE64" |
            base64 --decode -o "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"

          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KC" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild

          # Without this codesign hangs or fails: the private key is not in a
          # partition the codesign tool may access.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KC"

          security list-keychain -d user -s "$KC"
          security find-identity -v -p codesigning

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: >-
            ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP="$RUNNER_TEMP/build_pp.mobileprovision"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" |
            base64 --decode -o "$PP"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i "$PP" |
            grep -aA1 UUID |
            grep -o "[-a-zA-Z0-9]\{36\}" |
            head -1)
          echo "Profile UUID: $UUID"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP" "$profile_dir/$UUID.mobileprovision"

      - run: flutter pub get

      - name: Build signed IPA
        run: flutter build ipa --release --export-method=ad-hoc

      - uses: actions/upload-artifact@v6
        with:
          name: immich-z-ios-ipa-signed
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 90
